name: setc

# ============================================================
#  Docker Compose — S_E_T_C Laravel App
#  Usuario: setc (UID 1000, sin root en runtime)
# ============================================================

services:

  # ----------------------------------------------------------
  #  Aplicación Laravel (PHP-FPM + Nginx via Supervisor)
  # ----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APP_UID: "${APP_UID:-1000}"
        APP_GID: "${APP_GID:-1000}"
    image: setc/app:local
    container_name: setc_app
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Base de datos SQLite persistente
      - sqlite_data:/var/www/setc/database
      # Logs y caché persistente
      - app_storage:/var/www/setc/storage
      # En desarrollo: montar código fuente en vivo (comentar en producción)
      # - .:/var/www/setc:cached
    environment:
      APP_NAME: "${APP_NAME:-SETC}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_TIMEZONE: "${APP_TIMEZONE:-America/Mexico_City}"
      APP_LOCALE: "${APP_LOCALE:-es}"
      APP_FALLBACK_LOCALE: "${APP_FALLBACK_LOCALE:-es}"
      APP_FAKER_LOCALE: "${APP_FAKER_LOCALE:-es_MX}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/setc/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST:-mailpit}"
      MAIL_PORT: "${MAIL_PORT:-1025}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@setc.gob.mx}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-SETC Portal}"
    env_file:
      - path: .env.docker
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - setc_net

  # ----------------------------------------------------------
  #  Mailpit — servidor de correo local para desarrollo
  #  SMTP:  mailpit:1025  (interno, usado por Laravel)
  #  UI:    http://localhost:8025  (bandeja de entrada web)
  # ----------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: setc_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - setc_net

  # ----------------------------------------------------------
  #  Queue worker (misma imagen, comando diferente)
  # ----------------------------------------------------------
  queue:
    image: setc/app:local
    container_name: setc_queue
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - sqlite_data:/var/www/setc/database
      - app_storage:/var/www/setc/storage
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_TIMEZONE: "${APP_TIMEZONE:-America/Mexico_City}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/setc/database/database.sqlite
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      LOG_LEVEL: "${LOG_LEVEL:-warning}"
    env_file:
      - path: .env.docker
        required: false
    networks:
      - setc_net

  # ----------------------------------------------------------
  #  Scheduler (artisan schedule:work)
  # ----------------------------------------------------------
  scheduler:
    image: setc/app:local
    container_name: setc_scheduler
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - sqlite_data:/var/www/setc/database
      - app_storage:/var/www/setc/storage
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_TIMEZONE: "${APP_TIMEZONE:-America/Mexico_City}"
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/setc/database/database.sqlite
      LOG_CHANNEL: stderr
    env_file:
      - path: .env.docker
        required: false
    networks:
      - setc_net


# ============================================================
#  Volúmenes nombrados
# ============================================================
volumes:
  sqlite_data:
    driver: local
  app_storage:
    driver: local


# ============================================================
#  Red interna
# ============================================================
networks:
  setc_net:
    driver: bridge

