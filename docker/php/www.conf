; ============================================================
;  PHP-FPM Pool — usuario setc (sin root)
; ============================================================
[www]
user  = setc
group = setc

listen = 127.0.0.1:9000
listen.owner = setc
listen.group = setc
listen.mode  = 0660

pm = dynamic
pm.max_children      = 20
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests      = 500

; Logs a stderr (recogidos por Docker)
php_flag[display_errors] = off
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; Limitar acceso a archivos del sistema
php_admin_value[open_basedir] = /var/www/setc:/tmp

