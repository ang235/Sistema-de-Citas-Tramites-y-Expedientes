# ============================================================
#  Nginx virtual host — S_E_T_C Laravel
#  Puerto 8080 (sin privilegios)
# ============================================================
server {
    listen 8080;
    server_name _;

    root /var/www/setc/public;
    index index.php;

    charset utf-8;

    # Health check
    location = /up {
        access_log off;
        try_files $uri @php;
    }

    # Assets compilados (cache agresivo)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Archivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Todo lo demás → index.php (Laravel front controller)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location @php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Timeouts
        fastcgi_read_timeout 60;
        fastcgi_connect_timeout 10;
    }

    # Bloquear acceso a archivos ocultos y sensibles
    location ~ /\. {
        deny all;
    }

    location ~ ^/(artisan|composer\.(json|lock)|package\.json|\.env) {
        deny all;
        return 404;
    }
}

